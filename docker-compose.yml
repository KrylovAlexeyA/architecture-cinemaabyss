version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14
    container_name: cinemaabyss-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: cinemaabyss
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinemaabyss-network

  # ZooKeeper for Kafka
  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: cinemaabyss-zookeeper
    ports:
      - "2181:2181"
    networks:
      - cinemaabyss-network

  # Kafka
  kafka:
    image: wurstmeister/kafka:2.13-2.7.0
    container_name: cinemaabyss-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "movie-events:1:1,user-events:1:1,payment-events:1:1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cinemaabyss-network

  # Monolith Service
  monolith:
    build:
      context: ./src/monolith
      dockerfile: Dockerfile
    container_name: cinemaabyss-monolith
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_CONNECTION_STRING: postgres://postgres:postgres_password@postgres:5432/cinemaabyss?sslmode=disable
    networks:
      - cinemaabyss-network

  # Movies Microservice
  movies-service:
    build:
      context: ./src/microservices/movies
      dockerfile: Dockerfile
    container_name: cinemaabyss-movies-service
    depends_on:
      - postgres
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_CONNECTION_STRING: postgres://postgres:postgres_password@postgres:5432/cinemaabyss?sslmode=disable
    networks:
      - cinemaabyss-network

  # Users Microservice
  users-service:
    build:
      context: ./src/microservices/users
      dockerfile: Dockerfile
    container_name: cinemaabyss-users-service
    depends_on:
      - postgres
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      DB_CONNECTION_STRING: jdbc:postgresql://postgres:5432/cinemaabyss
      DB_USERNAME: postgres
      DB_PASSWORD: postgres_password
    networks:
      - cinemaabyss-network

  # Payments Microservice
  payments-service:
    build:
      context: ./src/microservices/payments
      dockerfile: Dockerfile
    container_name: cinemaabyss-payments-service
    depends_on:
      - postgres
    ports:
      - "8084:8084"
    environment:
      PORT: 8084
      DB_CONNECTION_STRING: jdbc:postgresql://postgres:5432/cinemaabyss
      DB_USERNAME: postgres
      DB_PASSWORD: postgres_password
    networks:
      - cinemaabyss-network

  # Subscriptions Microservice
  subscriptions-service:
    build:
      context: ./src/microservices/subscriptions
      dockerfile: Dockerfile
    container_name: cinemaabyss-subscriptions-service
    depends_on:
      - postgres
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      DB_CONNECTION_STRING: jdbc:postgresql://postgres:5432/cinemaabyss
      DB_USERNAME: postgres
      DB_PASSWORD: postgres_password
    networks:
      - cinemaabyss-network

  # Events Microservice
  events-service:
    build:
      context: ./src/microservices/events
      dockerfile: Dockerfile
    container_name: cinemaabyss-events-service
    depends_on:
      - postgres
      - kafka
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      KAFKA_BROKERS: kafka:9092
    networks:
      - cinemaabyss-network

  # Proxy Service (API Gateway)
  proxy-service:
    build:
      context: ./src/microservices/proxy
      dockerfile: Dockerfile
    container_name: cinemaabyss-proxy-service
    depends_on:
      - monolith
      - movies-service
      - events-service
      - subscriptions-service
      - payments-service
      - users-service
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      MONOLITH_URL: http://monolith:8080
      MOVIES_SERVICE_URL: http://movies-service:8081
      EVENTS_SERVICE_URL: http://events-service:8082
      GRADUAL_MIGRATION: "true"
      MOVIES_MIGRATION_PERCENT: "50"
      USERS_MIGRATION_PERCENT: "0"
      USERS_SERVICE_URL: http://users-service:8083
      PAYMENTS_MIGRATION_PERCENT: "0"
      PAYMENTS_SERVICE_URL: http://payments-service:8084
      SUBSCRIPTIONS_MIGRATION_PERCENT: "0"
      SUBSCRIPTIONS_SERVICE_URL: http://subscriptions-service:8085
    networks:
      - cinemaabyss-network

  # Kafka UI for monitoring Kafka
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cinemaabyss-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cinemaabyss
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - cinemaabyss-network

volumes:
  postgres-data:

networks:
  cinemaabyss-network:
    name: cinemaabyss-network
    driver: bridge